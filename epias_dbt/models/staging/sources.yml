version: 2

sources:
  - name: silver
    database: "{{ env_var('GCP_PROJECT_ID', 'epias-data-platform') }}"
    schema: silver

    # dbt source freshness: `dbt source freshness` ile çalıştır
    # warn_after  → son veriden bu kadar saat geçince uyarı
    # error_after → bu kadar geçince hata (DAG fail)
    loaded_at_field: date

    tables:
      # --- Piyasalar ve Fiyatlar ---
      - name: pricing
        description: "Saatlik PTF fiyatları (Gün Öncesi Piyasası kapanış)"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: interim_mcp
        description: "K.PTF — itiraz süreci tamamlanmamış GÖP fiyatı, teslim gününden ~1 gün önce (açık artırma kapanır kapanmaz) mevcut olur"
        # Looser than pricing: only populated after ~14:00 TRT each day (day-ahead
        # auction close), so a fresh row for "today" can legitimately lag by up to
        # ~14h even in a healthy pipeline — wider margin avoids false-positive alerts.
        freshness: {warn_after: {count: 38, period: hour}, error_after: {count: 62, period: hour}}

      - name: dam_clearing
        description: "GÖP saatlik alış/satış eşleşme hacimleri"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: dam_clearing_by_org
        description: "GÖP şirket bazlı saatlik eşleşme miktarı (matchedBids/matchedOffers) — ADR-0007 Faz 1 (plans/07-company-level-market-activity-kgup.md). Ayrı günlük DAG'da (epias_gop_company_activity_daily, 11:30 UTC) üretilir, hourly değil."
        # Günlük (hourly değil) bir DAG tarafından üretiliyor — geniş marj
        # (interim_mcp'nin ~14:00 TRT sonrası yayın gerekçesiyle aynı mantık).
        freshness: {warn_after: {count: 30, period: hour}, error_after: {count: 48, period: hour}}

      - name: idm_transactions
        description: "GİP (Gün İçi Piyasası) bireysel işlem kayıtları"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: smf
        description: "Sistem Marjinal Fiyatı (DGP uzlaştırma fiyatı)"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: system_direction
        description: "Saatlik sistem yönü (ENERGY_DEFICIT / ENERGY_SURPLUS / IN_BALANCE)"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      # --- Üretim ve Arz ---
      - name: generation
        description: "Kaynak bazlı saatlik gerçekleşen üretim (MWh)"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: unlicensed
        description: "YEKDEM lisanssız üretim saatlik verileri"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: res_forecast
        description: "RES (Yenilenebilir Enerji) tahmin vs gerçekleşen"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: aic
        description: "Emre Amade (kullanılabilir) kapasite kaynak bazlı"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: supply_demand
        description: "Arz-Talep eğrisi veri noktaları"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: dpp
        description: "KGÜP — Kesinleşmiş Günlük Üretim Planı, gün öncesi (EPİAŞ 5.71, /v1/generation/data/dpp). Kaynak adı endpoint adını yansıtıyor; önceden 'BGÜP' olarak yanlış etiketlenmişti, bkz. plans/07-company-level-market-activity-kgup.md."
        # Backfill beklemede — freshness geçici olarak geniş tutuldu
        freshness: {warn_after: {count: 72, period: hour}, error_after: {count: 168, period: hour}}

      - name: kgup_bulk_by_org
        description: "UEVÇB + şirket bazlı KGÜP (üretim planı) — ADR-0007 Faz 2 (plans/07-company-level-market-activity-kgup.md). Hourly pipeline'da, sadece o günün KGÜP'ü kesinleştikten sonra (~14:00 TRT) dolu gelir."
        freshness: {warn_after: {count: 38, period: hour}, error_after: {count: 62, period: hour}}

      - name: sbfgp
        description: "KUDÜP — Kesinleştirilmiş Uzlaştırma Dönemi Üretim Planı, GİP sonrası (EPİAŞ 5.83, /v1/generation/data/sbfgp). Kaynak adı endpoint adını yansıtıyor; önceden 'KGÜP' olarak yanlış etiketlenmişti — bu, 'dpp' kaynağının (gerçek KGÜP) sonraki uzlaştırma katmanı, bkz. plans/07-company-level-market-activity-kgup.md."
        # Freshness yok: tablo henüz mevcut değil, silver_sbfgp_backfill bekleniyor

      # --- Tüketim ve Talep ---
      - name: load_estimation
        description: "LEP yük tahmin planı (saatlik)"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: price_ind_bid
        description: "Fiyattan bağımsız teklifler"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: consumption
        description: "Gerçekleşen tüketim verileri"

      # --- Dengesizlik ve DGP ---
      - name: imbalance
        description: "Saatlik net dengesizlik miktarları"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: order_up
        description: "YAL (Yük Alma) saatlik sistem geneli regülasyon hacimleri"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      - name: order_down
        description: "YAT (Yük Atma) saatlik sistem geneli regülasyon hacimleri"
        freshness: {warn_after: {count: 26, period: hour}, error_after: {count: 50, period: hour}}

      # --- Boyut ve Dış Faktör Tabloları ---
      - name: participants
        description: "EPIAŞ piyasa katılımcıları (şirket listesi)"

      - name: uevcb_list
        description: "Uzlaştırma birimi listesi"

      - name: dams
        description: "Baraj doluluk ve rezerv verileri (günlük)"
        freshness: {warn_after: {count: 30, period: hour}, error_after: {count: 72, period: hour}}

      - name: outages
        description: "Santral arıza ve bakım bildirimleri"
        # Freshness yok: silver.outages.day INTEGER (epoch-ms) — timestamp değil,
        # dbt source freshness bu tipi desteklemiyor

      - name: weather
        description: "Açık Meteo saatlik hava durumu (4 şehir: İstanbul, İzmir, Konya, Ankara)"
        freshness: {warn_after: {count: 30, period: hour}, error_after: {count: 72, period: hour}}

      - name: fx_rates
        description: "TCMB EVDS günlük USD/TRY alış kuru (TP.DK.USD.A) — hafta sonu forward-fill"
        freshness: {warn_after: {count: 30, period: hour}, error_after: {count: 96, period: hour}}
