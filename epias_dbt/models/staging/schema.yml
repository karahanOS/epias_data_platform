# ──────────────────────────────────────────────────────────────
# MART MODEL TESTS
# ──────────────────────────────────────────────────────────────
  - name: mart_gop_volume_analysis
    description: "GÖP işlem hacimleri ve blok teklif analizleri"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - hour
    columns:
      - name: date
        tests:
          - not_null
      - name: ptf_try
        tests:
          - not_null:
              config:
                # severity=warn (2026-07-27, ADR-0004): same pre-existing
                # Faz-0 gap as assert_no_hourly_gaps (2024-12-31 dataset-start
                # partial day + 2026-07-22 known gap), not new duplication.
                severity: warn
      - name: total_buy_mwh
        tests:
          - not_null

  - name: mart_ptf_drivers
    description: "PTF tavan/taban sürücüleri ve Yenilenebilir penetrasyonu"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date
            - hour
    columns:
      - name: date
        tests:
          - not_null
      - name: renewable_penetration_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              # No upper bound: renewable forecast can legitimately exceed load
              # forecast during low-demand/high-wind or solar hours (>100%).

  - name: mart_capacity_utilization
    description: "Kaynak tipi bazında kapasite kullanım oranları (AİÇ / Üretim)"
    columns:
