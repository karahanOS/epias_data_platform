x-airflow-common: &airflow-common
  build: .
  env_file: [.env]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Allow up to 15 minutes of DB connectivity loss before declaring a task
    # a zombie. The ML training task (BigQuery + XGBoost) legitimately runs
    # 10-20 minutes and must not be killed by transient Docker DNS blips.
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: '900'
    PYTHONPATH: /opt/airflow/src
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/gcp-key.json
    # ADR-0004 (2026-07-27): email_on_failure alerting. GMAIL_APP_PASSWORD comes
    # from .env (never commit the real value) -- a Gmail App Password, not the
    # account password, requires 2FA enabled on the Google account.
    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    AIRFLOW__SMTP__SMTP_STARTTLS: 'true'
    AIRFLOW__SMTP__SMTP_SSL: 'false'
    AIRFLOW__SMTP__SMTP_PORT: '587'
    AIRFLOW__SMTP__SMTP_USER: mehmetkarahanc@gmail.com
    AIRFLOW__SMTP__SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: mehmetkarahanc@gmail.com
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./credentials:/opt/airflow/credentials
    - ./epias_dbt:/opt/airflow/epias_dbt
    - ./spark_jobs:/opt/airflow/spark
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - epias-net

services:

  postgres:
    image: postgres:13
    container_name: epias_postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data   # persist Airflow metadata across restarts
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped                    # auto-recover if the container crashes
    networks:
      - epias-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - "mkdir -p /opt/airflow/logs; chmod -R 775 /opt/airflow/logs 2>/dev/null; airflow webserver"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - "mkdir -p /opt/airflow/logs; chmod -R 775 /opt/airflow/logs 2>/dev/null; airflow scheduler"
    restart: unless-stopped

networks:
  epias-net:
    driver: bridge

volumes:
  postgres-db: